<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img">
<title>Der vollständige Datenfluss – Stand des Codes</title>
<rect width="1400" height="840" fill="#f5f8fa" rx="18"/>
<g font-family="Arial, sans-serif" fill="#173340">
<text x="32" y="36" font-size="24" font-weight="700" fill="#173340" text-anchor="start">Der vollständige Datenfluss – Stand des Codes</text>
<rect x="30" y="90" width="255" height="115" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="48" y="119" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Excel-Netzblatt</text>
<text x="48" y="147" font-size="16" font-weight="400" fill="#173340" text-anchor="start">SUB: Stationen</text>
<text x="48" y="171" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Andere Typen: Elemente</text>
<rect x="30" y="285" width="255" height="135" rx="12" fill="#fff0d9" stroke="#aac1c8"/>
<text x="48" y="314" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Zusätzliche echte Quellen</text>
<text x="48" y="342" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Freischaltungen.csv</text>
<text x="48" y="366" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Projekte.csv</text>
<text x="48" y="390" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Nicht aus Excel abgeleitet</text>
<rect x="350" y="90" width="240" height="115" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="368" y="119" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Parser --mjap</text>
<text x="368" y="147" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Prüfen + ausschließen</text>
<text x="368" y="171" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Restbestand erneut prüfen</text>
<rect x="655" y="65" width="300" height="235" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="673" y="94" font-size="19" font-weight="700" fill="#173340" text-anchor="start">CSV-Eingabeordner für MJAP</text>
<text x="673" y="122" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Stationen.csv (20 Spalten)</text>
<text x="673" y="146" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Netzelemente.csv (30)</text>
<text x="673" y="170" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Freischaltungen.csv</text>
<text x="673" y="194" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Projekte.csv</text>
<text x="673" y="218" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Komma; UTF-8; TT.MM.JJJJ</text>
<rect x="1025" y="90" width="340" height="115" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="1043" y="119" font-size="19" font-weight="700" fill="#173340" text-anchor="start">MJAP: Visualisierung erstellen</text>
<text x="1043" y="147" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Vier CSVs einlesen</text>
<text x="1043" y="171" font-size="16" font-weight="400" fill="#173340" text-anchor="start">SO/SK und Attribute erstellen</text>
<rect x="1025" y="355" width="340" height="135" rx="12" fill="#e9edf8" stroke="#aac1c8"/>
<text x="1043" y="384" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Interne Dateien + Geometrien</text>
<text x="1043" y="412" font-size="16" font-weight="400" fill="#173340" text-anchor="start">SO.csv, SK.csv; attribute.xlsx</text>
<text x="1043" y="436" font-size="16" font-weight="400" fill="#173340" text-anchor="start">missing_data.xlsx; SK.log</text>
<text x="1043" y="460" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Shapefiles + GeoPackages</text>
<rect x="655" y="355" width="300" height="135" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="673" y="384" font-size="19" font-weight="700" fill="#173340" text-anchor="start">QGIS-Visualisierung</text>
<text x="673" y="412" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Punkte, Linien, Projekte</text>
<text x="673" y="436" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Joins + Stile + Zeitfelder</text>
<text x="673" y="460" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Ergebnisse kontrollieren</text>
<rect x="350" y="355" width="240" height="135" rx="12" fill="#e9edf8" stroke="#aac1c8"/>
<text x="368" y="384" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Projekt speichern</text>
<text x="368" y="412" font-size="16" font-weight="400" fill="#173340" text-anchor="start">QGIS-Projekt als .qgz</text>
<text x="368" y="436" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Datendateien aufbewahren</text>
<rect x="350" y="560" width="605" height="90" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="368" y="589" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Optional danach: Länderkarte ergänzen</text>
<text x="368" y="617" font-size="16" font-weight="400" fill="#173340" text-anchor="start">DE / NL / BE / FR; vorhandene Netzlayer bleiben erhalten</text>
