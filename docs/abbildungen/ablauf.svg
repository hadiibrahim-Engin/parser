<polygon points="590,420 601.0,415.0 601.0,425.0" fill="#335566"/>
<path d="M470 490 L470 560" stroke="#335566" stroke-width="2.4" fill="none"/>
<polygon points="470,560 465.0,549.0 475.0,549.0" fill="#335566"/>
<rect x="30" y="525" width="255" height="125" rx="12" fill="#fff0d9" stroke="#aac1c8"/>
<text x="48" y="554" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Aktuelle Grenze</text>
<text x="48" y="582" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Excel allein erzeugt</text>
<text x="48" y="606" font-size="16" font-weight="400" fill="#173340" text-anchor="start">noch kein vollständiges</text>
<text x="48" y="630" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Vier-Tabellen-Paket.</text>
<rect x="30" y="715" width="1340" height="95" rx="12" fill="#fff0d9" stroke="#aac1c8"/>
<text x="48" y="744" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Automatischer Teil-Export und Pflege</text>
<text x="48" y="772" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Fehler/Warnungen: ganzes Element, abhängige Leitungen und komplette Dreibeine ausschließen.</text>
<text x="48" y="796" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Fehlerliste.csv + Pflegebericht.html; Exit 0 = sauber, 3 = Teil-Export, 2 = Abbruch.</text>
</g></svg>