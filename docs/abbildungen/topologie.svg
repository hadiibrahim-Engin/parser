<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img">
<title>Topologie: Excel-Dreibein wird zu einer Y-Zeile und zwei Paarzeilen</title>
<rect width="1400" height="700" fill="#f5f8fa" rx="18"/>
<g font-family="Arial, sans-serif" fill="#173340">
<text x="32" y="36" font-size="24" font-weight="700" fill="#173340" text-anchor="start">Topologie: Excel-Dreibein wird zu einer Y-Zeile und zwei Paarzeilen</text>
<rect x="30" y="80" width="420" height="100" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="48" y="109" font-size="19" font-weight="700" fill="#173340" text-anchor="start">1. CSV-Zeile: vollständiges Y</text>
<text x="48" y="137" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Anfang=A / Ende=B / T1=C / Y1=X</text>
<text x="48" y="161" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Name: LONG-NAME der ersten Excel-Zeile</text>
<rect x="485" y="80" width="420" height="100" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="503" y="109" font-size="19" font-weight="700" fill="#173340" text-anchor="start">2. CSV-Zeile: Paar A–C</text>
<text x="503" y="137" font-size="16" font-weight="400" fill="#173340" text-anchor="start">T1/T2/Y1/Y2 leer</text>
<text x="503" y="161" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Namenszusatz: ohne Bein B</text>
<rect x="940" y="80" width="430" height="100" rx="12" fill="#e1f1ed" stroke="#aac1c8"/>
<text x="958" y="109" font-size="19" font-weight="700" fill="#173340" text-anchor="start">3. CSV-Zeile: Paar B–C</text>
<text x="958" y="137" font-size="16" font-weight="400" fill="#173340" text-anchor="start">T1/T2/Y1/Y2 leer</text>
<text x="958" y="161" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Namenszusatz: ohne Bein A</text>
<path d="M90 250 L240 335" stroke="#335566" stroke-width="2.4" fill="none"/>
<path d="M390 250 L240 335" stroke="#335566" stroke-width="2.4" fill="none"/>
<path d="M240 425 L240 335" stroke="#335566" stroke-width="2.4" fill="none"/>
<circle cx="90" cy="250" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="90" y="256" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">A</text>
<circle cx="390" cy="250" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="390" y="256" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">B</text>
<circle cx="240" cy="425" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="240" y="431" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">C / T1</text>
<circle cx="240" cy="335" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="240" y="341" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">X / Y1</text>
<path d="M545 335 L845 335" stroke="#335566" stroke-width="2.4" fill="none"/>
<circle cx="545" cy="335" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="545" y="341" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">A</text>
<circle cx="845" cy="335" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="845" y="341" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">C</text>
<path d="M1000 335 L1305 335" stroke="#335566" stroke-width="2.4" fill="none"/>
<circle cx="1000" cy="335" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="1000" y="341" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">B</text>
<circle cx="1305" cy="335" r="27" fill="#ffffff" stroke="#117c77" stroke-width="3"/>
<text x="1305" y="341" font-size="17" font-weight="700" fill="#173340" text-anchor="middle">C</text>
<text x="240" y="490" font-size="19" font-weight="700" fill="#173340" text-anchor="middle">MJAP: drei Y-Teilstrecken</text>
<text x="695" y="490" font-size="19" font-weight="700" fill="#173340" text-anchor="middle">MJAP: eine direkte Linie</text>
<text x="1155" y="490" font-size="19" font-weight="700" fill="#173340" text-anchor="middle">MJAP: eine direkte Linie</text>
<rect x="30" y="545" width="1340" height="115" rx="12" fill="#fff0d9" stroke="#aac1c8"/>
<text x="48" y="574" font-size="19" font-weight="700" fill="#173340" text-anchor="start">Excel: 3 Beine → CSV: 3 Zeilen → MJAP: 5 Linienobjekte</text>
<text x="48" y="602" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Erste Excel-Zeile: A + B + T1=C + Y1=X. Zweite: A–C ohne B. Dritte: B–C ohne A.</text>
<text x="48" y="626" font-size="16" font-weight="400" fill="#173340" text-anchor="start">Y1 steht nur im ersten Eintrag; T2/Y2 bleiben leer. Paarlinien sind direkte Verbindungen.</text>
</g></svg>