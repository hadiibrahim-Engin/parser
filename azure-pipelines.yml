# CGMES MJAP Interface - CI and release.
#
# Verify runs on every push, pull request and tag.
# Package runs only for a v* tag: it builds the Windows executable, publishes it
# as a pipeline artifact, and commits it into releases/ on main.
#
# ONE-TIME SETUP, required before the first release:
#   Project Settings -> Repositories -> <repo> -> Security ->
#   "<Project> Build Service (<Org>)" -> set Contribute to Allow.
# Without it the final push in the Package stage fails with a 403.

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      # The pipeline commits here itself. Excluding it, together with the
      # [skip ci] marker on that commit, stops the pipeline retriggering itself.
      - releases/*
      - docs/*
      - README.md

pr:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.12'
  isRelease: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/v')]
  releaseBranch: 'main'

stages:
  - stage: Verify
    displayName: Lint and test
    jobs:
      - job: Checks
        displayName: ruff + pytest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: python -m pip install --upgrade uv
            displayName: Install uv

          - script: uv sync --extra gui --group dev
            displayName: Sync dependencies

          - script: uv run ruff check .
            displayName: Lint

          - script: uv run pytest -q --junitxml=junit/results.xml
            displayName: Test
            env:
              # No display on the agent; Qt renders offscreen.
              QT_QPA_PLATFORM: offscreen

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'junit/results.xml'
              testRunTitle: 'CGMES MJAP Interface'

  - stage: Package
    displayName: Build and publish the executable
    dependsOn: Verify
    condition: and(succeeded(), eq(variables.isRelease, true))
    jobs:
      - job: WindowsBuild
        displayName: PyInstaller on Windows
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            # Needed so the final step can push the built executable back.
            persistCredentials: true
            fetchDepth: 0

          - task: UsePythonVersion@0
            displayName: Use Python $(pythonVersion)
            inputs:
              versionSpec: '$(pythonVersion)'

          - script: python -m pip install --upgrade uv
            displayName: Install uv

          - powershell: |
              $ErrorActionPreference = 'Stop'
              uv sync --extra gui --group dev
              $declared = (uv run python -c "from cgmesparser.gui.version import __version__; print(__version__)").Trim()
              $tag = "$(Build.SourceBranchName)"
              $expected = $tag.TrimStart('v')
              if ($declared -ne $expected) {
                Write-Host "##vso[task.logissue type=error]Tag $tag does not match version.py ($declared)."
                exit 1
              }
              Write-Host "##vso[task.setvariable variable=releaseVersion]$declared"
              Write-Host "Building version $declared from tag $tag"
            displayName: Check the tag matches version.py

          - powershell: .\scripts\build.ps1 -SkipTests
            displayName: Build the executable
            # Verify already ran ruff and pytest on this exact commit.

          - task: PublishPipelineArtifact@1
            displayName: Publish the executable
            inputs:
              targetPath: 'dist'
              artifactName: 'CGMES-MJAP-Interface-$(releaseVersion)'

          - powershell: |
              $ErrorActionPreference = 'Stop'
              $version = "$(releaseVersion)"
              $name = "CGMES-MJAP-Interface-$version.exe"

              # A tag build starts in detached HEAD and cannot push from there,
              # so the release branch is checked out fresh before committing.
              git config user.email "build@azuredevops"
              git config user.name "Azure Pipelines"
              git fetch origin $(releaseBranch)
              git checkout -B $(releaseBranch) origin/$(releaseBranch)

              New-Item -ItemType Directory -Force -Path releases | Out-Null
              Copy-Item "dist\$name" "releases\$name" -Force
              Copy-Item "dist\$name.sha256" "releases\$name.sha256" -Force

              git add releases

              # git diff --cached --quiet exits 0 when there is nothing staged.
              git diff --cached --quiet
              if ($LASTEXITCODE -eq 0) {
                Write-Host "releases/ is already up to date; nothing to commit."
                exit 0
              }

              git commit -m "Add release $version executable [skip ci]"
              git push origin HEAD:$(releaseBranch)
              Write-Host "Committed releases/$name to $(releaseBranch)."
            displayName: Commit the executable to releases/
