[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-to-csv-converter"
version = "1.0.0"
description = "Converts an Excel network inventory into Stationen.csv and Netzelemente.csv"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "colorlog>=6.7",
]

[project.optional-dependencies]
# Optional accelerator: reads large workbooks about 5x faster than openpyxl.
fast = ["python-calamine>=0.2"]
dev = ["pytest>=7.4"]

[project.scripts]
excel-to-csv = "excelToCsv.cli:main"
qgis-country-map = "excelToCsv.mapProject:main"

[tool.setuptools]
packages = ["excelToCsv"]

[tool.setuptools.package-data]
excelToCsv = ["maps/*.geojson", "maps/*.md"]

[tool.pytest.ini_options]
# Test files follow this project's camelCase convention.
python_files = ["test*.py"]
python_functions = ["test*"]
testpaths = ["tests"]
addopts = "-q"
