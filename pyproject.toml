[project]
name = "cgmes2excel"
version = "0.1.0"
description = "Convert a CGMES export into the Stationen / NETZELEMENTE Excel workbook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
cgmes2excel = "cgmes2excel.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
