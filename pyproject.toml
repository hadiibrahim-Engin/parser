[project]
name = "cgmes-parser"
version = "0.1.0"
description = "CGMES MJAP Interface - desktop front end for CGMES / CIMLA processing and Excel export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.gui-scripts]
cgmes-parser = "cgmesparser.gui.app:main"

[project.scripts]
cgmes-parser-console = "cgmesparser.gui.app:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cgmesparser"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# "N" (pep8-naming) is deliberately not selected: this project uses camelCase
# identifiers throughout, and enabling N would flag every one of them.
select = ["E", "F", "I", "UP", "B"]
